{% extends "base.html" %}

{% block content %}
<section class="py-16 max-w-xl">
    <h1 class="text-3xl font-bold">{% if form.instance.pk %}Edit goal{% else %}New goal{% endif %}</h1>
    <form method="post" class="mt-6 space-y-4">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="px-4 py-2 bg-black text-white rounded">Save</button>
    </form>
    <p class="mt-4"><a href="{% url 'goal_list' %}" class="underline">Back to goals</a></p>
</section>
{% endblock %}
