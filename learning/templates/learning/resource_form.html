{% extends "base.html" %}

{% block content %}
<section class="py-16 max-w-xl">
    <h1 class="text-3xl font-bold">Edit resource</h1>
    <form method="post" class="mt-6 space-y-4">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="px-4 py-2 bg-black text-white rounded">Save</button>
    </form>
    <p class="mt-4"><a href="{% url 'goal_detail' resource.goal_id %}" class="underline">Back to goal</a></p>
</section>
{% endblock %}
