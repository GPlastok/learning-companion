{% load static tailwind_tags django_htmx %}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Learning Companion</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    {% tailwind_css %}
    {% htmx_script %}
</head>

<body class="bg-gray-50 text-black font-serif leading-normal tracking-normal">

<nav class="bg-white border-b">
    <div class="container mx-auto flex items-center justify-between py-4">
        <a href="{% url 'home' %}" class="text-xl font-bold">Learning Companion</a>
        {% if user.is_authenticated %}
        <div class="flex items-center gap-4">
            <a href="{% url 'goal_list' %}" class="underline">Goals</a>
            <a href="{% url 'profile' %}" class="underline">Profile</a>
            <form action="{% url 'logout' %}" method="post">
                {% csrf_token %}
                <button type="submit" class="px-3 py-1 border rounded">Log out</button>
            </form>
        </div>
        {% endif %}
    </div>
</nav>

<div class="container mx-auto">
    {% include "messages.html" %}
    {% block content %}{% endblock %}
</div>
</body>
</html>
